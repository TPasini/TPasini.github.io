name: Fetch figure candidates (one-off)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_figure_candidates.py"

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils ghostscript
      - run: pip install -q pillow
      - run: python scripts/fetch_figure_candidates.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figure-candidates
          git commit -m "Figure candidates from arXiv sources" || exit 0
          git pull --rebase origin main
          git push
